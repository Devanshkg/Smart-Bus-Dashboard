[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/report"
  to = "/.netlify/functions/report"
  status = 200

[[redirects]]
  from = "/api/buses"
  to = "/.netlify/functions/buses"
  status = 200

[[redirects]]
  from = "/api/assign"
  to = "/.netlify/functions/assign"
  status = 200